{% extends "base.html" %}

{% block content %}

<h1>Monthly Maintenance</h1>

<form method="POST">

<label>Member</label>

<select name="member_id">

{% for member in members %}

<option value="{{ member.id }}">

{{ member.member_number }}
-
{{ member.name }}

</option>

{% endfor %}

</select>


<label>Month</label>

<input
    type="month"
    name="month"
    required
>


<label>Amount</label>

<input
    type="number"
    name="amount"
    value="1000"
    step="0.01"
>


<label>Receipt Number</label>

<input
    type="text"
    name="receipt_number"
>


<button type="submit">

Save Maintenance

</button>

</form>


<h2>Maintenance Collection</h2>

<table>

<tr>

<th>Member</th>
<th>Month</th>
<th>Amount</th>
<th>Receipt</th>

</tr>

{% for record in records %}

<tr>

<td>{{ record.member.name }}</td>
<td>{{ record.month }}</td>
<td>₹{{ record.amount }}</td>
<td>{{ record.receipt_number }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
